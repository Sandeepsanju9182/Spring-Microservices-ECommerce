spring:
  application:
    name: ecom-api-service
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ecom-order-service
              uri: http://localhost:7070
              predicates:
                - Path=/order/**
            - id: ecom-inventory-service
              uri: http://localhost:7071
              predicates:
                - Path=/inventory/**

server:
  port: 7072

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka