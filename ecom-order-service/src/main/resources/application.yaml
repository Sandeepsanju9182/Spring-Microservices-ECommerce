spring:
  application:
    name: ecom-order-service

server:
  port: 8070

logging:
  level:
    com.debugd.info.ecomorderservice.client: DEBUG
    com.netflix.discovery: DEBUG

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    lease-renewal-interval-in-seconds: 30
    hostname: localhost

resilience4j:
  ratelimiter:
    instances:
      inventoryService:
        limit-for-period: 2  #2 requests per 10 second
        limit-refresh-period: 10s #10 seconds to refresh limits
        timeout-duration: 0s
